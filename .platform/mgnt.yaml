global:
  logging:
    level: error
fullnameOverride: "argocd"
configs:
  cm:
    controller.diff.server.side: "true"
    url: http://argocd.sbp.local
    application.resourceTrackingMethod: annotation+label
  params:
    server.insecure: true
redis-ha:
  enabled: true
  haproxy:
    enabled: true
    replicas: 3
redis:
  enabled: false
server:
  replicas: 2
  extraArgs:
    - --insecure
repoServer:
  replicas: 2
applicationSet:
  replicas: 2
